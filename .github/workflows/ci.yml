name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ordinary
            selection: --exclude-tag=migration
          - group: migration-inventory
            selection: --tag=migration-inventory
          - group: migration-other
            selection: --tag=migration-other
    name: backend (${{ matrix.group }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Check Django migrations
        if: matrix.group == 'ordinary'
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-test-key
        run: |
          python3 manage.py makemigrations --check --dry-run
          python3 manage.py check

      - name: Run tests
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-test-key
        run: |
          set +e
          python3 manage.py test cigars privnote accounting cigardomtabaka_backend \
            --settings=cigardomtabaka_backend.settings_test \
            ${{ matrix.selection }} \
            --parallel=1 \
            --durations=20 \
            --timing \
            --verbosity=1 2>&1 | tee /tmp/backend-test-output.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            annotation=$(tail -n 120 /tmp/backend-test-output.log | python3 -c 'import sys; value=sys.stdin.read()[-60000:]; print(value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
            echo "::error title=Backend tests failed (${{ matrix.group }})::$annotation"
          fi
          exit "$test_status"

      - name: Run price tracker tests
        if: matrix.group == 'ordinary'
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-test-key
        # This group tests ingestion/API behavior; real migrations run in every
        # Django database setup and both dedicated migration groups above.
        run: python3 -m pytest -q price_tracker/tests --nomigrations --durations=10

  # Preserve the existing required check name while requiring every shard.
  test:
    if: always()
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend group to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: test "$BACKEND_RESULT" = success

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend with typecheck
        working-directory: frontend
        run: npm run build

      - name: Package verified frontend
        run: python3 deploy/frontend_artifact.py pack static/frontend frontend-artifact "$GITHUB_SHA"

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: |
            frontend-artifact/frontend.tar.gz
            frontend-artifact/metadata.json
          if-no-files-found: error
          retention-days: 7
          # Re-running the frontend job replaces this same-run, same-SHA build.
          overwrite: true
