name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Check Django migrations
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-test-key
        run: |
          python3 manage.py makemigrations --check --dry-run
          python3 manage.py check

      - name: Run tests
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-test-key
        run: |
          set +e
          python3 manage.py test cigars privnote accounting \
            --settings=cigardomtabaka_backend.settings_test \
            --parallel=1 \
            --durations=20 \
            --timing \
            --verbosity=1 2>&1 | tee /tmp/backend-test-output.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            annotation=$(tail -n 120 /tmp/backend-test-output.log | python3 -c 'import sys; value=sys.stdin.read()[-60000:]; print(value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
            echo "::error file=.github/workflows/ci.yml,line=45,title=Backend tests failed::$annotation"
          fi
          exit "$test_status"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend with typecheck
        working-directory: frontend
        run: npm run build
