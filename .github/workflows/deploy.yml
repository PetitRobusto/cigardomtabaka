name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download frontend from the successful CI run
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: frontend-artifact

      - name: Verify frontend before transfer
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 deploy/frontend_artifact.py verify frontend-artifact "$DEPLOY_SHA"

      - name: Stage frontend on VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: frontend-artifact/frontend.tar.gz,frontend-artifact/metadata.json,deploy/frontend_artifact.py,deploy/check_database_integrity.py
          target: /tmp/cigardomtabaka-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1

      - name: Deploy to VPS
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_ATTEMPT: ${{ github.run_attempt }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          envs: DEPLOY_SHA,DEPLOY_RUN_ID,DEPLOY_ATTEMPT
          script: |
            set -e
            cd /opt/cigardomtabaka
            ARTIFACT_DIR="/tmp/cigardomtabaka-frontend-${DEPLOY_RUN_ID}-${DEPLOY_ATTEMPT}"
            DEPLOY_STAGE=artifact-validation
            STOREFRONT_DEPLOY=false
            cleanup() {
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "Deploy failed during $DEPLOY_STAGE. Inspect Web/cache state before retrying."
                if [ "$STOREFRONT_DEPLOY" = true ]; then
                  echo "Storefront worker is not automatically restored after failure."
                fi
              fi
              rm -rf -- "$ARTIFACT_DIR"
              exit "$status"
            }
            trap cleanup EXIT

            # Fail before changing code or database if this is not the verified build.
            venv/bin/python "$ARTIFACT_DIR/frontend_artifact.py" verify "$ARTIFACT_DIR" "$DEPLOY_SHA"

            echo "=== git pull ==="
            git config --global --add safe.directory /opt/cigardomtabaka 2>/dev/null || true
            # 生产机直连 GitHub 时，强制 HTTP/1.1，避免 Git protocol v2/HTTP2 返回伪 401。
            git -c http.version=HTTP/1.1 fetch origin main
            # 只部署本次 CI 验证的提交；过期 workflow 不得覆盖 production。
            CURRENT_MAIN_SHA=$(git rev-parse origin/main)
            if [ "$CURRENT_MAIN_SHA" != "$DEPLOY_SHA" ]; then
              echo "Skip stale CI result: verified $DEPLOY_SHA, current main is $CURRENT_MAIN_SHA"
              exit 0
            fi
            git cat-file -e "${DEPLOY_SHA}^{commit}"

            # Check the actual production DB before replacing code. Never delete
            # orphan records as a deployment side effect; remediation is separate.
            sudo -u www-data venv/bin/python "$ARTIFACT_DIR/check_database_integrity.py" cigars.db

            # Keep the old Web process on its cached pages while preparing the
            # new generation. Do not let an old worker load a new renderer.
            DEPLOY_STAGE=pause-storefront-worker
            if sudo systemctl is-enabled --quiet storefront-worker.service || sudo systemctl is-active --quiet storefront-worker.service; then
              STOREFRONT_DEPLOY=true
              sudo systemctl stop storefront-worker.service
            fi
            DEPLOY_STAGE=install-code-and-migrations
            git reset --hard "$DEPLOY_SHA"

            echo "=== pip install ==="
            source venv/bin/activate
            pip install -r requirements.txt

            echo "=== prepare runtime database access ==="
            # WAL/SHM created by maintenance users must inherit the service group.
            sudo chgrp www-data .
            sudo chmod g+rws .
            sudo chown www-data:www-data cigars.db
            sudo chmod g+rw cigars.db
            for sidecar in cigars.db-wal cigars.db-shm; do
              if [ -e "$sidecar" ]; then
                # SQLite may remove an idle sidecar between these commands.
                sudo chown www-data:www-data "$sidecar" || [ ! -e "$sidecar" ]
                sudo chmod g+rw "$sidecar" || [ ! -e "$sidecar" ]
              fi
            done
            sudo -u www-data test -w .
            sudo -u www-data sqlite3 -cmd ".timeout 5000" cigars.db "BEGIN IMMEDIATE; ROLLBACK;"

            echo "=== database migrate ==="
            sudo -u www-data env DJANGO_DEBUG=False venv/bin/python manage.py migrate

            echo "=== verify runtime database access ==="
            sudo -u www-data test -w .
            sudo -u www-data sqlite3 -cmd ".timeout 5000" cigars.db "BEGIN IMMEDIATE; ROLLBACK;"

            echo "=== generate responsive home images from existing media ==="
            DEPLOY_STAGE=generate-home-images
            sudo -u www-data env DJANGO_DEBUG=False venv/bin/python frontend/scripts/generate_responsive_assets.py --media-root media

            echo "=== install verified frontend ==="
            DEPLOY_STAGE=install-frontend
            python "$ARTIFACT_DIR/frontend_artifact.py" install "$ARTIFACT_DIR" "$DEPLOY_SHA" static/frontend

            echo "=== collectstatic ==="
            DJANGO_DEBUG=False python manage.py collectstatic --noinput

            # A successful render command can still leave a pending generation
            # after concurrent edits. Verify it and retry a bounded number of times.
            if [ "$STOREFRONT_DEPLOY" = true ]; then
              for attempt in 1 2 3; do
                DEPLOY_STAGE=render-storefront
                sudo -u www-data env DJANGO_DEBUG=False venv/bin/python manage.py render_storefront
                DEPLOY_STAGE=verify-storefront-cache
                if sudo -u www-data env DJANGO_DEBUG=False venv/bin/python manage.py check_storefront_cache; then
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "Storefront cache did not converge; Web restart withheld."
                  exit 1
                fi
              done
              DEPLOY_STAGE=verify-storefront-sitemap
              sudo -u www-data env DJANGO_DEBUG=False venv/bin/python manage.py check_storefront_sitemap
            fi

            echo "=== restart gunicorn ==="
            DEPLOY_STAGE=restart-web
            sudo systemctl restart gunicorn

            echo "=== restart storefront worker if enabled ==="
            # Preserve active-only workers as well as enabled workers. Never
            # enable/install a disabled and inactive storefront as a deploy side effect.
            DEPLOY_STAGE=restore-storefront-worker
            if [ "$STOREFRONT_DEPLOY" = true ]; then
              sudo systemctl restart storefront-worker.service
            fi

            echo "=== reload nginx ==="
            DEPLOY_STAGE=reload-nginx
            sudo nginx -t
            sudo systemctl reload nginx

            echo "=== deploy done ==="
