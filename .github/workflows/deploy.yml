name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          retry: 3
          script: |
            set -e
            cd /opt/cigardomtabaka

            echo "=== git pull ==="
            git config --global --add safe.directory /opt/cigardomtabaka 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            echo "=== pip install ==="
            source venv/bin/activate
            pip install -r requirements.txt

            echo "=== cleanup orphan FK ==="
            sqlite3 cigars.db "DELETE FROM cigars_cigarimage WHERE cigar_id NOT IN (SELECT id FROM cigars_cigar);"

            echo "=== database migrate ==="
            python manage.py migrate

            echo "=== frontend build ==="
            cd frontend
            npm ci
            npm run build
            cd ..

            echo "=== collectstatic ==="
            python manage.py collectstatic --noinput

            echo "=== restart gunicorn ==="
            sudo systemctl restart gunicorn

            echo "=== reload nginx ==="
            sudo nginx -t && sudo systemctl reload nginx

            echo "=== deploy done ==="
