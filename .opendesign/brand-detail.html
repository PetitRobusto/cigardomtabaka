<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乌普曼 — Moscow Cigar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mc-luxury-theme.css">
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo-mark">MC</div>
      <span>Moscow Cigar</span>
      <span style="color:var(--muted);font-size:13px;font-family:var(--font-body);font-weight:400;">· 品牌详情</span>
    </div>
    <nav class="topbar-right">
      <a href="brands.html">品牌</a>
      <a href="#">库存</a>
      <a href="index.html">价格</a>
      <a href="#">链接</a>
      <a href="#">管理</a>
      <div class="user">
        <div class="user-avatar">J</div>
        <span>jason</span>
      </div>
    </nav>
  </header>

  <!-- Breadcrumb -->
  <div class="breadcrumb container">
    <a href="brands.html">所有品牌</a>
    <span class="sep">/</span>
    <span class="current">乌普曼</span>
  </div>

  <!-- Main Content -->
  <main class="container" style="padding-bottom:80px;">

    <!-- Brand Hero -->
    <div class="brand-hero">
      <div class="brand-hero-logo">
        <span style="font-size:48px;font-family:var(--font-display);color:var(--accent);font-weight:600;">H</span>
      </div>
      <div class="brand-hero-info">
        <h1>乌普曼</h1>
        <div class="brand-hero-en">H. Upmann</div>
        <div class="brand-hero-meta">
          <span><strong>1844</strong> 年创立</span>
          <span><strong>古巴</strong> · 哈瓦那</span>
          <span><strong>全球品牌</strong></span>
        </div>
      </div>
      <div class="brand-hero-stats">
        <div class="brand-hero-stat">
          <span class="num">70</span>
          <span class="lbl">款雪茄</span>
        </div>
        <div class="brand-hero-stat">
          <span class="num">12</span>
          <span class="lbl">在售系列</span>
        </div>
        <div class="brand-hero-stat">
          <span class="num">$68</span>
          <span class="lbl">均价</span>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap;">
      <div class="search-box" style="max-width:320px;">
        <input type="text" id="cigarSearch" placeholder="搜索雪茄名称...">
      </div>
      <div class="filter-group" style="margin-left:auto;">
        <span class="filter-label">筛选</span>
        <div class="filter-pills">
          <button class="pill active" data-filter="all">全部</button>
          <button class="pill" data-filter="regular">常规</button>
          <button class="pill" data-filter="limited">限量</button>
          <button class="pill" data-filter="regional">地区限定</button>
        </div>
      </div>
    </div>

    <!-- Cigar Card Grid -->
    <div class="cigar-card-grid" id="cigarGrid"></div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <p style="font-family:var(--font-display);font-size:20px;margin-bottom:8px;">未找到匹配雪茄</p>
      <p>请尝试其他搜索词或筛选条件</p>
    </div>
  </main>

  <!-- Mobile Nav -->
  <nav class="mobile-nav">
    <a href="brands.html" class="mobile-nav-item active">
      <span>品牌</span>
    </a>
    <a href="#" class="mobile-nav-item">
      <span>库存</span>
    </a>
    <a href="index.html" class="mobile-nav-item">
      <span>价格</span>
    </a>
    <a href="#" class="mobile-nav-item">
      <span>链接</span>
    </a>
    <a href="#" class="mobile-nav-item">
      <span>我</span>
    </a>
  </nav>

  <script>
    const cigars = [
      { name: '鉴赏家 1 号', nameEn: 'Connoisseur No.1', size: '127mm', ring: 48, origin: '古巴', price: 85.00, type: 'regular', badge: '', badgeClass: '', href: 'cigar-detail.html' },
      { name: '鉴赏家 A', nameEn: 'Connoisseur A', size: '140mm', ring: 52, origin: '古巴', price: 92.00, type: 'regular', badge: '', badgeClass: '', href: '#' },
      { name: '大皇冠', nameEn: 'Coronas Major', size: '132mm', ring: 42, origin: '古巴', price: 68.00, type: 'other-special', badge: '特别', badgeClass: 'other-special', href: '#' },
      { name: '马格南 46', nameEn: 'Magnum 46', size: '143mm', ring: 46, origin: '古巴', price: 110.00, type: 'regular', badge: '', badgeClass: '', href: '#' },
      { name: '马格南 50', nameEn: 'Magnum 50', size: '160mm', ring: 50, origin: '古巴', price: 125.00, type: 'limited', badge: '限量', badgeClass: 'limited', href: '#' },
      { name: '小咖啡杯', nameEn: 'Petit Coronas', size: '129mm', ring: 42, origin: '古巴', price: 58.00, type: 'regular', badge: '', badgeClass: '', href: '#' },
      { name: '皇家罗布图', nameEn: 'Royal Robusto', size: '135mm', ring: 52, origin: '古巴', price: 95.00, type: 'regular', badge: '', badgeClass: '', href: '#' },
      { name: '马格南 54', nameEn: 'Magnum 54', size: '120mm', ring: 54, origin: '古巴', price: 135.00, type: 'regional', badge: '地限', badgeClass: 'regional', href: '#' },
      { name: '美食家', nameEn: 'Gourmet', size: '142mm', ring: 46, origin: '古巴', price: 78.00, type: 'regular', badge: '', badgeClass: '', href: '#' },
      { name: '初级皇冠', nameEn: 'Coronas Junior', size: '110mm', ring: 36, origin: '古巴', price: 45.00, type: 'regular', badge: '', badgeClass: '', href: '#' },
    ];

    function cigarSVG(letter) {
      return `<svg viewBox="0 0 320 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="32" y="52" width="256" height="28" rx="14" fill="#B8956A" opacity="0.2"/>
  <rect x="30" y="32" width="260" height="36" rx="18" fill="#C9A87C"/>
  <rect x="30" y="34" width="260" height="16" rx="8" fill="#D4B896" opacity="0.5"/>
  <rect x="48" y="40" width="224" height="1" fill="#A67B5B" opacity="0.3"/>
  <rect x="48" y="46" width="224" height="1" fill="#A67B5B" opacity="0.3"/>
  <rect x="48" y="52" width="224" height="1" fill="#A67B5B" opacity="0.3"/>
  <rect x="48" y="58" width="224" height="1" fill="#A67B5B" opacity="0.3"/>
  <rect x="48" y="64" width="224" height="1" fill="#A67B5B" opacity="0.3"/>
  <rect x="130" y="24" width="80" height="52" rx="4" fill="#7A1F2E"/>
  <rect x="134" y="28" width="72" height="44" rx="2" fill="none" stroke="#B87A3A" stroke-width="1.2"/>
  <ellipse cx="170" cy="50" rx="20" ry="16" fill="#B87A3A" opacity="0.4"/>
  <ellipse cx="170" cy="50" rx="12" ry="10" fill="#F5EFE8" opacity="0.2"/>
  <text x="170" y="55" text-anchor="middle" fill="#F5EFE8" opacity="0.6" font-family="serif" font-size="14" font-weight="600">${letter}</text>
  <rect x="134" y="32" width="72" height="1" fill="#B87A3A" opacity="0.5"/>
  <rect x="134" y="67" width="72" height="1" fill="#B87A3A" opacity="0.5"/>
  <ellipse cx="30" cy="50" rx="16" ry="20" fill="#A67B5B"/>
  <path d="M 18 38 Q 28 50 18 62" stroke="#8B6914" stroke-width="0.8" fill="none" opacity="0.25"/>
  <ellipse cx="290" cy="50" rx="8" ry="16" fill="#B8956A"/>
</svg>`;
    }

    function renderCards() {
      const grid = document.getElementById('cigarGrid');
      const empty = document.getElementById('emptyState');
      const q = document.getElementById('cigarSearch').value.toLowerCase().trim();
      const activeFilter = document.querySelector('.filter-pills .pill.active')?.dataset.filter || 'all';

      const filtered = cigars.filter(c => {
        const matchSearch = !q || c.name.toLowerCase().includes(q) || c.nameEn.toLowerCase().includes(q);
        let matchFilter = true;
        if (activeFilter === 'regular') matchFilter = c.type === 'regular';
        else if (activeFilter === 'limited') matchFilter = c.type === 'limited' || c.type === 'other-special' || c.type === 'commemorative';
        else if (activeFilter === 'regional') matchFilter = c.type === 'regional';
        return matchSearch && matchFilter;
      });

      if (filtered.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      grid.style.display = 'grid';
      empty.style.display = 'none';

      grid.innerHTML = filtered.map(c => {
        const badgeHtml = c.badge ? `<span class="cigar-card-badge ${c.badgeClass}">${c.badge}</span>` : '';
        return `<a href="${c.href}" class="cigar-card ${c.type}" data-type="${c.type}">
  <div class="cigar-card-header">
    <div>
      <div class="cigar-card-name">${c.name}</div>
      <div class="cigar-card-name-en">${c.nameEn}</div>
    </div>
    ${badgeHtml}
  </div>
  <div class="cigar-card-image">
    ${cigarSVG('H')}
  </div>
  <div class="cigar-card-footer">
    <span class="cigar-card-spec">${c.size} · ${c.ring}环径 · ${c.origin}</span>
    <span class="cigar-card-price"><span class="currency">$</span>${c.price.toFixed(2)}</span>
  </div>
</a>`;
      }).join('');
    }

    document.getElementById('cigarSearch').addEventListener('input', renderCards);
    document.querySelectorAll('.filter-pills .pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.filter-pills .pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        renderCards();
      });
    });

    renderCards();
  </script>
</body>
</html>
