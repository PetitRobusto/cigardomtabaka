<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案三：现代玻璃 · 品牌详情</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Georgia,"Noto Serif SC",serif;min-height:100vh;
  background:#0a0a0a;color:#e8dcc8;
  background-image:
    radial-gradient(ellipse at 30% 20%,rgba(200,164,92,0.05) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 60%,rgba(139,46,46,0.03) 0%,transparent 50%);
}
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(15,15,15,0.65);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,0.05);
  padding:0 24px;height:56px;display:flex;align-items:center;gap:12px;
}
nav .logo{font-size:16px;font-weight:bold;color:#c8a45c;letter-spacing:2px;}
nav .path{font-size:12px;color:rgba(255,255,255,0.3);}
main{max-width:1000px;margin:0 auto;padding:24px 24px 80px;}
.back{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.3);text-decoration:none;padding:8px 16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;transition:all .3s;}
.back:hover{color:#c8a45c;border-color:rgba(200,164,92,0.2);background:rgba(200,164,92,0.05);}

.brand-hero{
  margin:40px 0 48px;text-align:center;
}
.brand-hero .init{
  width:100px;height:100px;margin:0 auto 24px;border-radius:50%;
  background:rgba(200,164,92,0.08);backdrop-filter:blur(10px);
  border:1px solid rgba(200,164,92,0.1);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;color:#c8a45c;box-shadow:0 0 60px rgba(200,164,92,0.05);
}
.brand-hero h1{font-size:36px;font-weight:normal;letter-spacing:5px;margin-bottom:6px;}
.brand-hero .en{font-size:13px;color:rgba(255,255,255,0.2);font-style:italic;margin-bottom:16px;}
.brand-hero .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.tag{font-size:9px;padding:4px 12px;border-radius:6px;letter-spacing:.5px;}
.tag-cuban{background:rgba(200,50,50,0.15);color:#D48888;border:1px solid rgba(200,50,50,0.2);}
.tag-global{background:rgba(200,164,92,0.1);color:#c8a45c;border:1px solid rgba(200,164,92,0.2);}

.section{margin-top:40px;}
.section h2{font-size:11px;font-weight:normal;letter-spacing:2px;color:rgba(255,255,255,0.3);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.04);}

.cigar-list{display:flex;flex-direction:column;gap:10px;}
.cigar-card{
  background:rgba(255,255,255,0.02);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.04);border-radius:12px;
  padding:20px 24px;text-decoration:none;color:inherit;
  display:flex;align-items:center;gap:20px;
  transition:all .35s cubic-bezier(.4,0,.2,1);
}
.cigar-card:hover{
  background:rgba(255,255,255,0.04);border-color:rgba(200,164,92,0.15);
  transform:translateX(6px);
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
}
.cigar-card .thumb{
  width:48px;height:48px;border-radius:8px;
  background:rgba(200,164,92,0.06);display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.cigar-card .info{flex:1;min-width:0}
.cigar-card .cn{font-size:15px;font-weight:bold;letter-spacing:.5px;margin-bottom:2px;}
.cigar-card .en{font-size:11px;color:rgba(255,255,255,0.2);}
.cigar-card .meta{font-size:10px;color:rgba(255,255,255,0.2);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.cigar-card .arrow{color:rgba(200,164,92,0.2);font-size:20px;transition:all .3s;}
.cigar-card:hover .arrow{color:#c8a45c;}

@media(max-width:640px){
  .cigar-card{padding:16px 20px;gap:14px;}
  .cigar-card .thumb{width:40px;height:40px}
}
</style>
</head>
<body>
<nav><div class="logo">MOSCOW CIGAR</div><div class="path">/ 高希霸</div></nav>
<main>
  <a href="#" class="back">← 品牌目录</a>
  <div class="brand-hero">
    <div class="init">C</div>
    <h1>高希霸</h1>
    <div class="en">Cohiba · 始于 1966</div>
    <div class="tags">
      <span class="tag tag-cuban">🇨🇺 古巴</span>
      <span class="tag tag-global">全球品牌 · 68 款</span>
    </div>
  </div>

  <div class="section">
    <h2>常规系列</h2>
    <div class="cigar-list">
      <a href="#" class="cigar-card">
        <div class="thumb">🚬</div>
        <div class="info">
          <div class="cn">世纪六号 Siglo VI</div>
          <div class="en">Siglo VI</div>
          <div class="meta"><span>Canonazo</span><span>·</span><span>150 × 52</span></div>
        </div>
        <div class="arrow">→</div>
      </a>
      <a href="#" class="cigar-card">
        <div class="thumb">🚬</div>
        <div class="info">
          <div class="cn">罗布图 Robusto</div>
          <div class="en">Robusto</div>
          <div class="meta"><span>Robusto</span><span>·</span><span>124 × 50</span></div>
        </div>
        <div class="arrow">→</div>
      </a>
      <a href="#" class="cigar-card">
        <div class="thumb">🚬</div>
        <div class="info">
          <div class="cn">贝伊可 54 Behike 54</div>
          <div class="en">Behike 54</div>
          <div class="meta"><span>Behike 54</span><span>·</span><span>144 × 54</span><span class="tag tag-cuban" style="font-size:8px">BHK</span></div>
        </div>
        <div class="arrow">→</div>
      </a>
    </div>
  </div>

  <div class="section">
    <h2>特别发行</h2>
    <div class="cigar-list">
      <a href="#" class="cigar-card">
        <div class="thumb">🚬</div>
        <div class="info">
          <div class="cn">护身符 2019 限量版</div>
          <div class="en">Talismán Edición Limitada 2019</div>
          <div class="meta"><span>Double Robusto</span><span>·</span><span>154 × 54</span><span class="tag tag-global" style="font-size:8px">限量版</span></div>
        </div>
        <div class="arrow">→</div>
      </a>
    </div>
  </div>
</main>
</body>
</html>
