<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案三：现代玻璃 · 品牌目录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Georgia,"Noto Serif SC",serif;
  background:#0a0a0a;color:#e8dcc8;min-height:100vh;
  background-image:
    radial-gradient(ellipse at 20% 10%,rgba(200,164,92,0.04) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 80%,rgba(139,46,46,0.03) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(200,164,92,0.02) 0%,transparent 70%);
}
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(15,15,15,0.65);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,0.05);
  padding:0 24px;height:56px;display:flex;align-items:center;gap:16px;
}
nav .logo{font-size:16px;font-weight:bold;color:#c8a45c;letter-spacing:2px;}
nav .sep{color:rgba(255,255,255,0.15);}

main{max-width:1300px;margin:0 auto;padding:48px 24px 100px;}
.hero{text-align:center;margin-bottom:56px;}
.hero h1{font-size:clamp(28px,6vw,48px);font-weight:normal;letter-spacing:4px;margin-bottom:8px;
  background:linear-gradient(135deg,#c8a45c 0%,#e8dcc8 50%,#c8a45c 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p{font-size:12px;color:rgba(255,255,255,0.25);letter-spacing:2px;}

.section{margin-bottom:48px}
.section-header{
  display:flex;align-items:center;gap:16px;margin-bottom:24px;
}
.section-header h2{
  font-size:12px;font-weight:normal;letter-spacing:3px;
  color:rgba(255,255,255,0.4);text-transform:uppercase;
}

/* Glass grid */
.glass-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.glass-card{
  background:rgba(255,255,255,0.03);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.06);border-radius:16px;
  padding:28px 20px;text-align:center;text-decoration:none;color:inherit;
  transition:all .4s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;
}
.glass-card::before{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(135deg,rgba(200,164,92,0.08) 0%,transparent 40%,rgba(200,164,92,0.04) 100%);
  opacity:0;transition:opacity .4s;
}
.glass-card:hover{
  transform:translateY(-6px);
  border-color:rgba(200,164,92,0.2);
  background:rgba(255,255,255,0.05);
  box-shadow:0 20px 60px rgba(0,0,0,0.4),0 0 40px rgba(200,164,92,0.05);
}
.glass-card:hover::before{opacity:1}
.glass-card .icon{
  width:56px;height:56px;margin:0 auto 16px;border-radius:50%;
  background:rgba(200,164,92,0.1);display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#c8a45c;transition:all .4s;
}
.glass-card:hover .icon{transform:scale(1.1);box-shadow:0 0 30px rgba(200,164,92,0.15);}
.glass-card .name{font-size:14px;font-weight:bold;letter-spacing:1px;margin-bottom:4px;}
.glass-card .count{font-size:11px;color:rgba(255,255,255,0.25);margin-bottom:10px;}
.glass-card .tags{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;}
.tag{font-size:8px;padding:3px 8px;border-radius:4px;letter-spacing:.5px;}
.tag-cuban{background:rgba(200,50,50,0.15);color:#D48888;border:1px solid rgba(200,50,50,0.2);}
.tag-global{background:rgba(200,164,92,0.1);color:#c8a45c;border:1px solid rgba(200,164,92,0.2);}
.tag-value{background:rgba(91,140,90,0.1);color:#6B9C6A;border:1px solid rgba(91,140,90,0.2);}
.tag-disc{background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.05);}

.glass-card.dim{opacity:.4;filter:grayscale(.6);}
.glass-card.dim:hover{opacity:.6;filter:grayscale(.3);}

/* Small grid for value brands */
.glass-grid-sm{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
</style>
</head>
<body>

<nav><div class="logo">MOSCOW CIGAR</div></nav>

<main>
  <div class="hero">
    <h1>古巴雪茄目录</h1>
    <p>27 品牌 · 1,240 款 · 古巴传承</p>
  </div>

  <div class="section">
    <div class="section-header"><h2>✦ 全球品牌</h2></div>
    <div class="glass-grid">
      <a href="#" class="glass-card"><div class="icon">C</div><div class="name">高希霸</div><div class="count">68 款</div><div class="tags"><span class="tag tag-cuban">古巴</span><span class="tag tag-global">全球</span></div></a>
      <a href="#" class="glass-card"><div class="icon">M</div><div class="name">蒙特</div><div class="count">104 款</div><div class="tags"><span class="tag tag-cuban">古巴</span><span class="tag tag-global">全球</span></div></a>
      <a href="#" class="glass-card"><div class="icon">R</div><div class="name">罗密欧与朱丽叶</div><div class="count">121 款</div><div class="tags"><span class="tag tag-cuban">古巴</span><span class="tag tag-global">全球</span></div></a>
      <a href="#" class="glass-card"><div class="icon">P</div><div class="name">帕特加斯</div><div class="count">89 款</div><div class="tags"><span class="tag tag-cuban">古巴</span><span class="tag tag-global">全球</span></div></a>
      <a href="#" class="glass-card"><div class="icon">H</div><div class="name">好友</div><div class="count">73 款</div><div class="tags"><span class="tag tag-cuban">古巴</span><span class="tag tag-global">全球</span></div></a>
      <a href="#" class="glass-card"><div class="icon">U</div><div class="name">乌普曼</div><div class="count">67 款</div><div class="tags"><span class="tag tag-cuban">古巴</span><span class="tag tag-global">全球</span></div></a>
    </div>
  </div>

  <div class="section">
    <div class="section-header"><h2>✦ 价值之选</h2></div>
    <div class="glass-grid glass-grid-sm">
      <a href="#" class="glass-card"><div class="icon">J</div><div class="name">比亚达</div><div class="count">16 款</div><div class="tags"><span class="tag tag-cuban">古巴</span><span class="tag tag-value">价值</span></div></a>
      <a href="#" class="glass-card"><div class="icon">Q</div><div class="name">金特罗</div><div class="count">11 款</div><div class="tags"><span class="tag tag-cuban">古巴</span><span class="tag tag-value">价值</span></div></a>
      <a href="#" class="glass-card"><div class="icon">V</div><div class="name">威古洛</div><div class="count">5 款</div><div class="tags"><span class="tag tag-cuban">古巴</span><span class="tag tag-value">价值</span></div></a>
    </div>
  </div>

  <div class="section">
    <div class="section-header"><h2>✦ 历史珍藏</h2></div>
    <div class="glass-grid glass-grid-sm">
      <a href="#" class="glass-card dim"><div class="icon">G</div><div class="name">关达拉美拉</div><div class="count">3 款</div><div class="tags"><span class="tag tag-cuban">古巴</span><span class="tag tag-disc">停产</span></div></a>
    </div>
  </div>
</main>

</body>
</html>
