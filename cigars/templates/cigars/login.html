{% extends "base.html" %}
{% block html_attrs %}data-theme="dark"{% endblock %}
{% block title %}登录 · CigarDomTabaka{% endblock %}

{% block body %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="card bg-base-200 border border-base-300 w-full max-w-sm">
    <div class="card-body p-8">
      <div class="text-center mb-6">
        <div class="text-3xl mb-3"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon"><path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd"/></svg></div>
        <h1 class="text-xl font-bold tracking-wide text-accent">CigarDomTabaka</h1>
        <p class="text-sm text-base-content/50 mt-1">工作人员登录</p>
      </div>

      <form id="login-form" class="flex flex-col gap-4">
        <div>
          <label class="label pb-1"><span class="label-text text-xs">用户名</span></label>
          <input type="text" name="username" class="input input-bordered w-full" placeholder="输入用户名" autofocus autocomplete="username">
        </div>
        <div>
          <label class="label pb-1"><span class="label-text text-xs">密码</span></label>
          <input type="password" name="password" class="input input-bordered w-full" placeholder="输入密码" autocomplete="current-password">
        </div>

        <div id="error-msg" class="text-error text-sm hidden"></div>

        <button type="submit" class="btn btn-accent w-full mt-2">登录</button>
      </form>
    </div>
  </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = this.querySelector('button[type=submit]');
  const err = document.getElementById('error-msg');
  err.classList.add('hidden');
  btn.textContent = '登录中...'; btn.disabled = true;

  try {
    const fd = new URLSearchParams(new FormData(this));
    const r = await fetch('/api/login/', {method:'POST', body: fd});
    const d = await r.json();
    if (d.ok) {
      window.location.href = '/';
    } else {
      err.textContent = d.error || '登录失败';
      err.classList.remove('hidden');
    }
  } catch(ex) {
    err.textContent = '网络错误';
    err.classList.remove('hidden');
  }
  btn.textContent = '登录'; btn.disabled = false;
});
</script>
{% endblock %}
