# Production TLS configuration, based on the existing Certbot certificate paths.
# Install only after backing up the live config and validating with nginx -t.
server {
    listen 80;
    server_name cigardomtabaka.com www.cigardomtabaka.com;
    return 301 https://cigardomtabaka.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.cigardomtabaka.com;
    ssl_certificate /etc/letsencrypt/live/cigardomtabaka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cigardomtabaka.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://cigardomtabaka.com$request_uri;
}

server {
    listen 443 ssl;
    server_name cigardomtabaka.com;
    ssl_certificate /etc/letsencrypt/live/cigardomtabaka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cigardomtabaka.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /static/frontend/startup-loader.js {
        alias /opt/cigardomtabaka/staticfiles/frontend/startup-loader.js;
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        alias /opt/cigardomtabaka/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /opt/cigardomtabaka/media/;
        expires 7d;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;
}
