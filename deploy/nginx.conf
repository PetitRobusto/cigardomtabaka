# cigardomtabaka.com — Nginx config
# 放置到: /etc/nginx/sites-available/cigardomtabaka
# 启用: ln -s /etc/nginx/sites-available/cigardomtabaka /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name cigardomtabaka.com www.cigardomtabaka.com;

    # 静态文件 — Django collectstatic 产物
    location /static/ {
        alias /opt/cigardomtabaka/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 用户上传图片
    location /media/ {
        alias /opt/cigardomtabaka/media/;
        expires 7d;
    }

    # 代理到 gunicorn
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/gunicorn.sock;
    }

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
