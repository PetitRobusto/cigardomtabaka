<!doctype html>
<html lang="zh-CN" data-cdt-starting>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/static/frontend/logo-motion.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/static/frontend/logo-opening-motion-v2.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/static/frontend/habanos-specialist.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CigarDomTabaka · 价格监控</title>
    <style>
      html,body{min-height:100%;margin:0}html{background:#faf8f5}body{color:#2c2416;background:#faf8f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}.cdt-starting{overflow:hidden}.cdt-starting #root{opacity:0}.cdt-starting.cdt-revealing #root{opacity:1;transition:opacity 290ms ease-out 70ms}.cdt-starting [data-startup-logo-target]{visibility:hidden}
      #startup-loader{position:fixed;inset:0;z-index:9999;overflow:hidden}#startup-loader[hidden]{display:none}.cdt-startup__surface{position:absolute;inset:0;background:#faf8f5}.cdt-startup__composition{position:absolute;left:50%;top:50%;width:min(350px,calc(100vw - 40px));text-align:center;transform:translate(-50%,-50%)}.cdt-startup__logo{display:block;width:188px;height:auto;margin:auto;visibility:hidden;opacity:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none}#startup-loader[data-logo-ready=true] .cdt-startup__logo{visibility:visible;opacity:1}.cdt-startup__logo--docking{position:relative}.cdt-startup__status{display:flex;min-height:44px;margin:30px 0 0;align-items:center;justify-content:center;gap:10px;color:#2c2416;font-size:15px;font-weight:600;line-height:1.5;letter-spacing:.04em}.cdt-startup__specialist{display:block;width:34px;height:auto;flex:none;user-select:none;-webkit-user-drag:none}.cdt-startup__status-copy{display:inline-flex;align-items:center;justify-content:center}.cdt-loading-dots{display:inline-flex;width:22px;margin-left:4px;align-items:center;justify-content:space-between}.cdt-loading-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.25;animation:cdt-loading-dot 1.2s ease-in-out infinite}.cdt-loading-dots i:nth-child(2){animation-delay:.16s}.cdt-loading-dots i:nth-child(3){animation-delay:.32s}#startup-loader[data-phase=failed] .cdt-loading-dots{display:none}@keyframes cdt-loading-dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}.cdt-startup__recovery{position:absolute;top:100%;left:0;right:0;padding-top:8px}.cdt-startup__retry{min-height:44px;padding:9px 14px;border:0;color:#7a1f2e;background:transparent;font:12px inherit;text-decoration:underline;text-underline-offset:4px;cursor:pointer}.cdt-startup__retry[hidden]{display:none}.cdt-startup__retry:focus-visible{outline:2px solid #7a1f2e;outline-offset:3px}
      @media(max-width:520px){.cdt-startup__logo{width:156px}.cdt-startup__status{font-size:13px;letter-spacing:.025em}.cdt-startup__specialist{width:30px}}@media(max-height:420px){.cdt-startup__logo{width:132px}.cdt-startup__status{margin-top:18px;font-size:13px}.cdt-startup__specialist{width:28px}}@media(prefers-reduced-motion:reduce){.cdt-starting.cdt-revealing #root{transition:none}.cdt-loading-dots i{animation:none;opacity:.55}}
    </style>
  </head>
  <body class="cdt-starting">
    <section id="startup-loader" data-phase="intro" aria-busy="true">
      <div class="cdt-startup__surface" aria-hidden="true"></div>
      <div class="cdt-startup__composition">
        <img class="cdt-startup__logo" data-motion-src="/static/frontend/logo-opening-motion-v2.svg" data-static-src="/static/frontend/logo-motion.webp" width="640" height="525" alt="" aria-hidden="true" />
        <div class="cdt-startup__status" role="status" aria-live="polite" aria-atomic="true"><img class="cdt-startup__specialist" src="/static/frontend/habanos-specialist.png" width="173" height="216" alt="Habanos Specialist" /><span class="cdt-startup__status-copy"><span class="cdt-startup__status-label">莫斯科持证雪茄服务商</span><span class="cdt-loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></span></div>
        <div class="cdt-startup__recovery"><button class="cdt-startup__retry" type="button" hidden>重新加载</button></div>
      </div>
    </section>
    <div id="root"></div>
    <script src="/static/frontend/startup-loader.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
