<!doctype html>
<html lang="zh-CN" data-cdt-starting>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/static/frontend/logo-motion.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/static/frontend/logo-opening-motion.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CigarDomTabaka · 价格监控</title>
    <style>
      html,body{min-height:100%;margin:0}html{background:#faf8f5}body{color:#2c2416;background:#faf8f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}.cdt-starting{overflow:hidden}.cdt-starting #root{opacity:0}.cdt-starting.cdt-revealing #root{opacity:1;transition:opacity 290ms ease-out 70ms}.cdt-starting [data-startup-logo-target]{visibility:hidden}
      #startup-loader{position:fixed;inset:0;z-index:9999;overflow:hidden}#startup-loader[hidden]{display:none}.cdt-startup__surface{position:absolute;inset:0;background:#faf8f5}.cdt-startup__composition{position:absolute;left:50%;top:50%;width:min(330px,calc(100vw - 40px));text-align:center;transform:translate(-50%,-50%)}.cdt-startup__logo{display:block;width:188px;height:auto;margin:auto;transform-origin:0 0;user-select:none;-webkit-user-drag:none}.cdt-startup__logo--docking{position:relative}.cdt-startup__status{min-height:24px;margin:30px 0 0;color:#2c2416;font-size:12px;line-height:2;letter-spacing:.1em}.cdt-startup__recovery{position:absolute;top:100%;left:0;right:0;padding-top:8px}.cdt-startup__retry{min-height:44px;padding:9px 14px;border:0;color:#7a1f2e;background:transparent;font:12px inherit;text-decoration:underline;text-underline-offset:4px;cursor:pointer}.cdt-startup__retry[hidden]{display:none}.cdt-startup__retry:focus-visible{outline:2px solid #7a1f2e;outline-offset:3px}
      @media(max-width:520px){.cdt-startup__logo{width:156px}.cdt-startup__status{letter-spacing:.04em}}@media(max-height:420px){.cdt-startup__logo{width:132px}.cdt-startup__status{margin-top:18px}}@media(prefers-reduced-motion:reduce){.cdt-starting.cdt-revealing #root{transition:none}}
    </style>
  </head>
  <body class="cdt-starting">
    <section id="startup-loader" data-phase="intro" aria-busy="true">
      <div class="cdt-startup__surface" aria-hidden="true"></div>
      <div class="cdt-startup__composition">
        <img class="cdt-startup__logo" src="/static/frontend/logo-opening-motion.svg" data-static-src="/static/frontend/logo-motion.webp" width="640" height="525" alt="CigarDomTabaka / Сигар Дом Табака" />
        <p class="cdt-startup__status" role="status" aria-live="polite" aria-atomic="true">莫斯科持证雪茄服务商</p>
        <div class="cdt-startup__recovery"><button class="cdt-startup__retry" type="button" hidden>重新加载</button></div>
      </div>
    </section>
    <div id="root"></div>
    <script src="/static/frontend/startup-loader.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
