<style>
.a-pen{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}
.a-register{opacity:.12}.a-finish{visibility:hidden}
.a-tip{fill:none;stroke:#B87A3A;stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-dasharray:.035 .965;opacity:0}
.idle-leaf{display:none}
.loop{animation:cycle-fade 2580ms ease-in-out infinite}
.a-c{animation:draw-c 2580ms ease-in-out infinite}
.a-flourish{animation:draw-flourish 2580ms ease-in-out infinite}
.a-tip{animation:draw-tip 2580ms ease-in-out infinite}
.a-leaf{animation:show-leaf 2580ms ease-in-out infinite}
.a-word{animation:show-word 2580ms ease-in-out infinite}
.a-lower{animation:show-lower 2580ms ease-in-out infinite}
.a-finish{animation:show-finish 2580ms steps(1,end) infinite}
@keyframes cycle-fade{0%{opacity:.18}7%,93%{opacity:1}100%{opacity:.18}}
@keyframes draw-c{0%{stroke-dashoffset:1}19.4%,100%{stroke-dashoffset:0}}
@keyframes draw-flourish{0%,23.3%{stroke-dashoffset:1}38.8%,100%{stroke-dashoffset:0}}
@keyframes draw-tip{0%,23.3%{stroke-dashoffset:1;opacity:0}27%,35%{opacity:.85}38.8%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes show-leaf{0%,5.8%{clip-path:inset(70% 0 0)}16.7%,100%{clip-path:inset(0)}}
@keyframes show-word{0%,42.6%{clip-path:inset(0 100% 0 32%)}52.3%,100%{clip-path:inset(0 0 0 32%)}}
@keyframes show-lower{0%,47.3%{clip-path:inset(60% 0 40%)}57.8%,100%{clip-path:inset(60% 0 0)}}
@keyframes show-finish{0%,58%{visibility:hidden}58.1%,93%{visibility:visible}93.1%,100%{visibility:hidden}}
@media(prefers-reduced-motion:reduce){.loop{animation:none}.a-finish{visibility:visible}.a-register,.a-tip{display:none}.a-c,.a-flourish,.a-leaf,.a-word,.a-lower{display:none}}
</style>
