<!-- 链接有效期 -->
<label class="form-control">
  <span class="label-text text-sm text-base-content/70 mb-1">链接有效期</span>
  <select name="duration" class="select select-bordered w-full">
    {% for h, label in durations %}
    <option value="{{ h }}" {% if h == 24 %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</label>

<!-- 密码保护 -->
<label class="form-control">
  <span class="label-text text-sm text-base-content/70 mb-1">密码保护（可选）</span>
  <input type="text" name="password" class="input input-bordered w-full" placeholder="留空则不设密码">
</label>

<!-- 阅后即焚 -->
<label class="cursor-pointer flex items-center gap-3 py-2">
  <input type="hidden" name="burn" value="off">
  <input type="checkbox" name="burn" class="toggle toggle-accent" checked>
  <span class="text-sm text-base-content/70">阅后即焚（仅可查看一次）</span>
</label>
