{% extends "base.html" %}
{% block html_attrs %}data-theme="dark"{% endblock %}
{% block title %}生成链接 · 链接已生成{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="card bg-base-100 shadow-lg max-w-md w-full">
    <div class="card-body text-center p-8">
      <div class="text-4xl mb-4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon"><path d="M15.98 1.804a1 1 0 00-1.96 0l-.24 1.192a1 1 0 01-.784.785l-1.192.238a1 1 0 000 1.962l1.192.238a1 1 0 01.785.785l.238 1.192a1 1 0 001.962 0l.238-1.192a1 1 0 01.785-.785l1.192-.238a1 1 0 000-1.962l-1.192-.238a1 1 0 01-.785-.785l-.238-1.192zM6.949 5.684a1 1 0 00-1.898 0l-.683 2.051a1 1 0 01-.633.633l-2.051.683a1 1 0 000 1.898l2.051.684a1 1 0 01.633.632l.683 2.051a1 1 0 001.898 0l.683-2.051a1 1 0 01.633-.633l2.051-.683a1 1 0 000-1.898l-2.051-.683a1 1 0 01-.633-.633L6.95 5.684zM13.949 13.684a1 1 0 00-1.898 0l-.184.553a1 1 0 01-.632.633l-.553.183a1 1 0 000 1.898l.553.183a1 1 0 01.632.633l.184.553a1 1 0 001.898 0l.184-.553a1 1 0 01.632-.633l.553-.183a1 1 0 000-1.898l-.553-.184a1 1 0 01-.632-.632l-.184-.553z"/></svg></div>
      <h2 class="text-lg font-bold text-accent tracking-wide">链接已生成</h2>
      <p class="text-sm text-base-content/50 mt-1">{{ brand.name }} · {{ total }} 款雪茄</p>

      <div class="bg-base-200 border border-dashed border-base-300 rounded-lg p-4 my-6 break-all">
        <a href="{{ url }}" class="text-sm text-accent no-underline hover:underline" id="pn-link">{{ url }}</a>
      </div>

      <button class="btn btn-accent w-full" onclick="copyLink()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon"><path fill-rule="evenodd" d="M15.988 3.012A2.25 2.25 0 0118 5.25v6.5A2.25 2.25 0 0115.75 14H13.5V7a2.5 2.5 0 00-2.5-2.5H4.012A2.25 2.25 0 016.25 2.5h1A3.513 3.513 0 0110.75 0h.5c1.116 0 2.111.522 2.75 1.336V2.5h1c.375 0 .738.097 1.05.268.11.064.216.143.313.244zM1.5 7.25a1 1 0 011-1h9a1 1 0 011 1v11a1 1 0 01-1 1h-9a1 1 0 01-1-1v-11z" clip-rule="evenodd"/></svg> 复制链接</button>

      <p class="text-xs text-base-content/40 mt-4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 6a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 6zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg> 此链接仅可访问一次，关闭后立即销毁</p>
      <p class="text-xs text-error/50 mt-1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-13a.75.75 0 00-1.5 0v5c0 .414.336.75.75.75h4a.75.75 0 000-1.5h-3.25V5z" clip-rule="evenodd"/></svg> 1 小时后自动过期</p>
    </div>
  </div>
</div>

<script>
function copyLink(){
  const link = document.getElementById('pn-link').textContent;
  navigator.clipboard.writeText(link).then(() => {
    const btn = document.querySelector('.btn-accent');
    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd"/></svg> 已复制！';
    btn.classList.replace('btn-accent','btn-success');
    setTimeout(() => { btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon"><path fill-rule="evenodd" d="M15.988 3.012A2.25 2.25 0 0118 5.25v6.5A2.25 2.25 0 0115.75 14H13.5V7a2.5 2.5 0 00-2.5-2.5H4.012A2.25 2.25 0 016.25 2.5h1A3.513 3.513 0 0110.75 0h.5c1.116 0 2.111.522 2.75 1.336V2.5h1c.375 0 .738.097 1.05.268.11.064.216.143.313.244zM1.5 7.25a1 1 0 011-1h9a1 1 0 011 1v11a1 1 0 01-1 1h-9a1 1 0 01-1-1v-11z" clip-rule="evenodd"/></svg> 复制链接'; btn.classList.replace('btn-success','btn-accent'); }, 2000);
  });
}
</script>
{% endblock %}
