{% extends "base.html" %}
{% block html_attrs %}data-theme="dark"{% endblock %}
{% block title %}需要密码 · 生成链接{% endblock %}
{% block navbar_title %}
<span class="text-sm text-base-content/50 ml-3 hidden sm:inline">· <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon"><path d="M12.232 4.232a2.5 2.5 0 013.536 3.536l-1.225 1.225a.75.75 0 001.061 1.06l1.224-1.224a4 4 0 00-5.656-5.656l-3 3a4 4 0 00.606 6.364.75.75 0 101.06-1.06 2.5 2.5 0 01-.378-3.477l3-3zM7.768 15.768a2.5 2.5 0 01-3.536-3.536l1.225-1.225a.75.75 0 00-1.061-1.06l-1.224 1.224a4 4 0 005.656 5.656l3-3a4 4 0 00-.606-6.364.75.75 0 00-1.06 1.06 2.5 2.5 0 01.378 3.477l-3 3z"/></svg> 生成链接</span>
{% endblock %}

{% block body %}
<div class="container mx-auto px-4 py-12 max-w-md text-center">
  <div class="card bg-base-200 border border-base-300">
    <div class="card-body p-6">
      <div class="text-4xl mb-4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon"><path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd"/></svg></div>
      <h2 class="text-lg font-bold text-accent mb-2">此链接已加密</h2>
      <p class="text-sm text-base-content/50 mb-4">请输入密码以查看内容</p>
      {% if error %}
      <div class="alert alert-error mb-4 text-sm py-1.5">{{ error }}</div>
      {% endif %}
      <form method="POST" class="flex flex-col gap-3">
        {% csrf_token %}
        <input type="password" name="password" class="input input-bordered text-center" placeholder="输入密码" autofocus>
        <button type="submit" class="btn btn-accent">确认</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
