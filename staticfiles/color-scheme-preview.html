<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CigarDomTabaka 配色方案选择</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: Georgia, "Noto Serif SC", serif; }
  .scheme-card { transition: transform .2s, box-shadow .2s; cursor: pointer; }
  .scheme-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,.15); }
  .scheme-card.selected { outline: 3px solid #A16207; outline-offset: 2px; }
  .swatch { width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(0,0,0,.08); }
</style>
</head>
<body class="min-h-screen p-6" style="background:#F5F0EB">

<div class="max-w-6xl mx-auto">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold tracking-[3px] mb-2" style="color:#3D3226">CigarDomTabaka — 配色方案选择</h1>
    <p class="text-sm opacity-50">点击卡片选中方案，下方实时预览效果。选好后告诉嘎子哥编号！</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-8" id="schemes">

    <!-- 方案一：极简黑金 -->
    <div class="scheme-card bg-white rounded-xl p-4 shadow-md" data-scheme="1" onclick="selectScheme(1)">
      <h3 class="text-sm font-bold mb-2">🖤 方案一 · 极简黑金</h3>
      <p class="text-xs opacity-40 mb-3">经典奢侈 · 克制高级</p>
      <div class="flex gap-1.5 mb-2">
        <div class="swatch" style="background:#FAFAF9" title="背景"></div>
        <div class="swatch" style="background:#1C1917" title="主色"></div>
        <div class="swatch" style="background:#A16207" title="强调色"></div>
        <div class="swatch" style="background:#FFFFFF" title="卡片"></div>
      </div>
      <div class="flex gap-1.5">
        <div class="swatch" style="background:#44403C" title="辅色"></div>
        <div class="swatch" style="background:#E8ECF0" title="柔和"></div>
        <div class="swatch" style="background:#D6D3D1" title="边框"></div>
        <div class="swatch" style="background:#0C0A09" title="正文"></div>
      </div>
    </div>

    <!-- 方案二：海军绅士 -->
    <div class="scheme-card bg-white rounded-xl p-4 shadow-md" data-scheme="2" onclick="selectScheme(2)">
      <h3 class="text-sm font-bold mb-2">💙 方案二 · 海军绅士</h3>
      <p class="text-xs opacity-40 mb-3">蓝金搭配 · 沉稳奢华</p>
      <div class="flex gap-1.5 mb-2">
        <div class="swatch" style="background:#F8FAFC" title="背景"></div>
        <div class="swatch" style="background:#1E3A8A" title="主色"></div>
        <div class="swatch" style="background:#A16207" title="强调色"></div>
        <div class="swatch" style="background:#FFFFFF" title="卡片"></div>
      </div>
      <div class="flex gap-1.5">
        <div class="swatch" style="background:#3B82F6" title="辅色"></div>
        <div class="swatch" style="background:#E9EEF5" title="柔和"></div>
        <div class="swatch" style="background:#BFDBFE" title="边框"></div>
        <div class="swatch" style="background:#1E40AF" title="正文"></div>
      </div>
    </div>

    <!-- 方案三：暗金剧院 -->
    <div class="scheme-card bg-white rounded-xl p-4 shadow-md" data-scheme="3" onclick="selectScheme(3)">
      <h3 class="text-sm font-bold mb-2">💜 方案三 · 暗金剧院</h3>
      <p class="text-xs opacity-40 mb-3">戏剧靛金 · 深邃张力</p>
      <div class="flex gap-1.5 mb-2">
        <div class="swatch" style="background:#0F0F23" title="背景"></div>
        <div class="swatch" style="background:#1E1B4B" title="主色"></div>
        <div class="swatch" style="background:#CA8A04" title="强调色"></div>
        <div class="swatch" style="background:#1B1B30" title="卡片"></div>
      </div>
      <div class="flex gap-1.5">
        <div class="swatch" style="background:#312E81" title="辅色"></div>
        <div class="swatch" style="background:#27273B" title="柔和"></div>
        <div class="swatch" style="background:#4338CA" title="边框"></div>
        <div class="swatch" style="background:#F8FAFC" title="正文"></div>
      </div>
    </div>

    <!-- 方案四：墨绿翡翠 -->
    <div class="scheme-card bg-white rounded-xl p-4 shadow-md" data-scheme="4" onclick="selectScheme(4)">
      <h3 class="text-sm font-bold mb-2">💚 方案四 · 墨绿翡翠</h3>
      <p class="text-xs opacity-40 mb-3">暗黑翠绿 · 金融质感</p>
      <div class="flex gap-1.5 mb-2">
        <div class="swatch" style="background:#020617" title="背景"></div>
        <div class="swatch" style="background:#0F172A" title="主色"></div>
        <div class="swatch" style="background:#22C55E" title="强调色"></div>
        <div class="swatch" style="background:#0E1223" title="卡片"></div>
      </div>
      <div class="flex gap-1.5">
        <div class="swatch" style="background:#1E293B" title="辅色"></div>
        <div class="swatch" style="background:#1A1E2F" title="柔和"></div>
        <div class="swatch" style="background:#334155" title="边框"></div>
        <div class="swatch" style="background:#F8FAFC" title="正文"></div>
      </div>
    </div>

    <!-- 方案五：烟草大地 -->
    <div class="scheme-card bg-white rounded-xl p-4 shadow-md" data-scheme="5" onclick="selectScheme(5)">
      <h3 class="text-sm font-bold mb-2">🤎 方案五 · 烟草大地</h3>
      <p class="text-xs opacity-40 mb-3">暖棕奶油 · 自然质感</p>
      <div class="flex gap-1.5 mb-2">
        <div class="swatch" style="background:#F5F0EB" title="背景"></div>
        <div class="swatch" style="background:#4A3728" title="主色"></div>
        <div class="swatch" style="background:#B8860B" title="强调色"></div>
        <div class="swatch" style="background:#FFFFFF" title="卡片"></div>
      </div>
      <div class="flex gap-1.5">
        <div class="swatch" style="background:#6B5E4F" title="辅色"></div>
        <div class="swatch" style="background:#E8DCCF" title="柔和"></div>
        <div class="swatch" style="background:#D4C4B0" title="边框"></div>
        <div class="swatch" style="background:#2C1E0F" title="正文"></div>
      </div>
    </div>

  </div>

  <div class="text-center mb-4">
    <span class="text-sm opacity-40 tracking-wider">↓ 选中方案预览 ↓</span>
  </div>
  <div id="preview" class="rounded-2xl p-6 shadow-lg transition-all duration-500"></div>
</div>

<script>
const schemes = {
  1: {
    name: '极简黑金 · 经典奢侈',
    bg: '#FAFAF9',
    text: '#0C0A09',
    card: '#FFFFFF',
    cardText: '#0C0A09',
    accent: '#A16207',
    accentHex: '#B87A15',
    primary: '#1C1917',
    secondary: '#44403C',
    muted: '#64748B',
    mutedBg: '#E8ECF0',
    border: '#D6D3D1',
    badgeText: '#A16207',
    badgeBg: 'rgba(161,98,7,0.08)',
    destructive: '#DC2626'
  },
  2: {
    name: '海军绅士 · 蓝金搭配',
    bg: '#F8FAFC',
    text: '#1E40AF',
    card: '#FFFFFF',
    cardText: '#1E40AF',
    accent: '#A16207',
    accentHex: '#B87A15',
    primary: '#1E3A8A',
    secondary: '#3B82F6',
    muted: '#64748B',
    mutedBg: '#E9EEF5',
    border: '#BFDBFE',
    badgeText: '#1E3A8A',
    badgeBg: 'rgba(30,58,138,0.08)',
    destructive: '#DC2626'
  },
  3: {
    name: '暗金剧院 · 戏剧张力',
    bg: '#0F0F23',
    text: '#F8FAFC',
    card: '#1B1B30',
    cardText: '#F8FAFC',
    accent: '#CA8A04',
    accentHex: '#E5A605',
    primary: '#1E1B4B',
    secondary: '#312E81',
    muted: '#94A3B8',
    mutedBg: '#27273B',
    border: '#4338CA',
    badgeText: '#CA8A04',
    badgeBg: 'rgba(202,138,4,0.12)',
    destructive: '#EF4444'
  },
  4: {
    name: '墨绿翡翠 · 暗黑质感',
    bg: '#020617',
    text: '#F8FAFC',
    card: '#0E1223',
    cardText: '#F8FAFC',
    accent: '#22C55E',
    accentHex: '#3CDB75',
    primary: '#0F172A',
    secondary: '#1E293B',
    muted: '#94A3B8',
    mutedBg: '#1A1E2F',
    border: '#334155',
    badgeText: '#22C55E',
    badgeBg: 'rgba(34,197,94,0.12)',
    destructive: '#EF4444'
  },
  5: {
    name: '烟草大地 · 自然质感',
    bg: '#F5F0EB',
    text: '#2C1E0F',
    card: '#FFFFFF',
    cardText: '#2C1E0F',
    accent: '#B8860B',
    accentHex: '#D4A754',
    primary: '#4A3728',
    secondary: '#6B5E4F',
    muted: '#8A7E6E',
    mutedBg: '#E8DCCF',
    border: '#D4C4B0',
    badgeText: '#B8860B',
    badgeBg: 'rgba(184,134,11,0.08)',
    destructive: '#DC2626'
  }
};

let current = 1;

function selectScheme(n) {
  current = n;
  document.querySelectorAll('.scheme-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`[data-scheme="${n}"]`).classList.add('selected');
  renderPreview(n);
}

function renderPreview(n) {
  const s = schemes[n];
  const p = document.getElementById('preview');
  p.style.background = s.bg;
  p.style.color = s.text;
  const isDark = [3, 4].includes(n);

  p.innerHTML = `
    <div class="max-w-4xl mx-auto">
      <div class="flex items-center justify-between mb-6 pb-4" style="border-bottom:1px solid ${s.border}">
        <div>
          <span class="text-xs tracking-[4px] uppercase opacity-50">CigarDomTabaka</span>
          <h2 class="text-xl font-bold mt-1">市场价格监控</h2>
        </div>
        <div class="flex gap-2">
          <span class="px-3 py-1.5 rounded-full text-xs font-bold" style="color:${s.accent};border:1px solid ${s.accent}">仪表盘</span>
          <span class="px-3 py-1.5 rounded-full text-xs" style="color:${s.muted};border:1px solid ${s.border}">预警</span>
        </div>
      </div>

      <!-- Stats Bar -->
      <div class="grid grid-cols-4 gap-3 mb-6">
        ${[
          {v:'324',l:'价格条目'},
          {v:'154',l:'雪茄款式'},
          {v:'25',l:'品牌覆盖'},
          {v:'1',l:'价格来源'}
        ].map(item => `
        <div class="rounded-lg p-3 text-center shadow-sm" style="background:${s.card};color:${s.cardText}">
          <span class="block text-2xl font-bold" style="color:${s.accent}">${item.v}</span>
          <span class="block text-xs mt-1 opacity-60">${item.l}</span>
        </div>`).join('')}
      </div>

      <!-- Brand Tabs -->
      <div class="flex flex-wrap gap-2 mb-5 p-2 rounded-lg" style="background:${s.card}">
        <span class="px-3 py-1.5 rounded-full text-xs font-bold text-white" style="background:${s.accent}">全部品牌</span>
        ${['高希霸','蒙特','罗密欧与朱丽叶','帕特加斯','好友','乌普曼'].map(b => `
        <span class="px-3 py-1.5 rounded-full text-xs" style="color:${isDark?'#94A3B8':s.muted};border:1px solid ${s.border}">${b}</span>`).join('')}
      </div>

      <!-- Price Cards -->
      <div class="grid grid-cols-3 gap-3 mb-6">
        ${[
          {brand:'高希霸',name:'贝伊可 52',en:'BHK 52',p:'$2,750',box:'25支'},
          {brand:'高希霸',name:'世纪 6 号',en:'Siglo VI',p:'$3,950',box:'25支'},
          {brand:'蒙特',name:'双艾蒙度',en:'Double Edmundo',p:'$1,580',box:'25支'},
          {brand:'蒙特',name:'老鹰',en:'Águila',p:'$2,100',box:'25支'},
          {brand:'罗密欧与朱丽叶',name:'丘吉尔',en:'Churchill',p:'$1,650',box:'25支'},
          {brand:'高希霸',name:'罗布图',en:'Robusto',p:'$2,290',box:'25支'}
        ].map(item => `
        <div class="rounded-lg overflow-hidden shadow-sm cursor-pointer hover:-translate-y-1 transition-transform" style="background:${s.card};color:${s.cardText}">
          <div class="px-3 py-2" style="background:${s.mutedBg};color:${s.muted}">
            <span class="text-[0.65rem] uppercase tracking-widest font-bold">${item.brand}</span>
          </div>
          <div class="p-3">
            <h3 class="text-sm font-bold">${item.name}</h3>
            <p class="text-xs italic opacity-50 mb-2">${item.en}</p>
            <div class="flex justify-between items-center">
              <span class="inline-block text-[0.6rem] font-bold px-1.5 py-0.5 rounded" style="color:${s.accent};background:${s.badgeBg};border:1px solid ${s.accent}30">${item.box}</span>
              <span class="text-base font-bold" style="color:${s.accent}">${item.p}</span>
            </div>
          </div>
        </div>`).join('')}
      </div>

      <!-- Badge Showcase -->
      <div class="flex gap-2 flex-wrap">
        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold border" style="color:${s.accent};border-color:${s.accent};background:${s.badgeBg}">COH 有货</span>
        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold" style="color:#FFF;background:${s.accent}">25支</span>
        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold" style="color:${s.destructive};background:${s.destructive}15;border:1px solid ${s.destructive}30">缺货</span>
        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs border" style="color:${s.muted};border-color:${s.border}">COH</span>
      </div>
    </div>
  `;
}

selectScheme(1);
</script>

</body>
</html>
